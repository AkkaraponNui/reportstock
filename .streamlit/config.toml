# Settings that apply when the app is served, locally or hosted.
# Secrets never go here. Put them in the host's secrets panel, or in
# .streamlit/secrets.toml locally, which .gitignore excludes.

[server]
headless = true
# Hosts set the port themselves; this is only the local default.
port = 8501
# Uploads are not part of this app, so keep the limit small.
maxUploadSize = 5
# Reruns on file change are useful locally and wasteful on a host.
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"

[client]
# A stack trace in a public deployment leaks absolute paths and internals, and
# this file is what ships to the host. The comment used to say exactly that
# while the value below still said "stacktrace". For local debugging, override
# it on the command line instead of editing this file:
#   uv run python -m streamlit run app.py --client.showErrorDetails=full
showErrorDetails = "none"
